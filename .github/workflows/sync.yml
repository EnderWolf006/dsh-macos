# 自动同步工作流
# 作用：当 main 分支有更新时，自动镜像推送到目标仓库
# 注意：此文件仅在源仓库生效，目标仓库不会保留此文件

name: Sync to Organization

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    uses: iiiiiei/github-actions/.github/workflows/sync-core.yml@main
    with:
      target_repo: Farverge/dsh-macos
    secrets:
      TARGET_PAT: ${{ secrets.FARVERGE_ORG_TOKEN }}
